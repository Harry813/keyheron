name: Build and verify

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      stage_binaries:
        description: Stage tested native binaries for the tag release job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
            rust_host: x86_64-unknown-linux-gnu
          - os: macos-15
            platform: darwin-arm64
            rust_host: aarch64-apple-darwin
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the locked Rust core
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_HOST"
          cargo build --release --locked --manifest-path rust-core/Cargo.toml
          cargo test --locked --manifest-path rust-core/Cargo.toml
          mkdir -p bin
          cp rust-core/target/release/agent-access-core "bin/agent-access-core-$PLATFORM"
      - name: Verify the official KeyFence download and run the local checks
        run: |
          python3 tools.py --install
          node --check web/app.js
          python3 verify.py
          python3 verify_web.py
          python3 verify_external.py
          python3 scripts/test_security_launcher.py
          python3 scripts/test_security_state.py
          python3 scripts/test_security_limits.py
          python3 bench.py --samples 24 --concurrency 1 4 --warmup 2 --json
          python3 scripts/test_release.py
      - name: Verify redistribution notices against the complete locked dependency graph
        if: runner.os == 'Linux'
        run: python3 scripts/rust_notices.py --check
      - name: Read GitHub installation scope through the SDK proxy (trusted refs only)
        if: >-
          runner.os == 'Linux' && github.event_name == 'push' &&
          github.repository == 'Harry813/keyheron' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          KEYHERON_TEST_INSTALLATION_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_github.py
      - name: Stage the binary just tested
        if: inputs.stage_binaries
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/staged"
          cp rust-core/target/release/agent-access-core "$RUNNER_TEMP/staged/keyheron-core-$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.stage_binaries
        with:
          name: tested-${{ matrix.platform }}
          path: ${{ runner.temp }}/staged/
          retention-days: 3
          if-no-files-found: error
