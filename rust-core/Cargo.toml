[package]
name = "agent-access-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
authors = ["Harry Wang"]
description = "Environment-scoped agent access, temporary approvals and local audit"
repository = "https://github.com/Harry813/keyheron"

[[bin]]
name = "agent-access-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "io-std", "time", "fs", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
